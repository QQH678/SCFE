# YOLOv5 by Ultralytics, GPL-3.0 license
# TPH-YOLOv5 + EMA_attention

# Parameters
nc: 80  # number of classes
depth_multiple: 1.0
width_multiple: 1.0
# anchors: 4

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],      # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],        # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],        # 3-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],        # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],       # 7-P5/32
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],          # 9
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],                    # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 11
   [[-1, 6], 1, Concat, [1]],                     # 12 cat backbone P4
   [-1, 3, C3, [512, False]],                     # 13

   [-1, 1, Conv, [256, 1, 1]],                    # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 15
   [[-1, 4], 1, Concat, [1]],                     # 16 cat backbone P3
   [-1, 3, C3, [256, False]],                     # 17 P3/8-small

   [-1, 1, Conv, [128, 1, 1]],                    # 18
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 19
   [[-1, 2], 1, Concat, [1]],                     # 20 cat backbone P2
   [-1, 2, C3TR, [128, False]],                   # 21 P2/4-xsmall
   [-1, 1, EMA_attention, [128]],                 # 22 EMA-P2

   [-1, 1, Conv, [128, 3, 2]],                    # 23
   [[-1, 18, 4], 1, Concat, [1]],                 # 24 cat head P3
   [-1, 2, C3TR, [256, False]],                   # 25 P3/8-small
   [-1, 1, EMA_attention, [256]],                 # 26 EMA-P3

   [-1, 1, Conv, [256, 3, 2]],                    # 27
   [[-1, 14, 6], 1, Concat, [1]],                 # 28 cat head P4
   [-1, 2, C3TR, [512, False]],                   # 29 P4/16-medium
   [-1, 1, EMA_attention, [512]],                 # 30 EMA-P4

   [-1, 1, Conv, [512, 3, 2]],                    # 31
   [[-1, 10], 1, Concat, [1]],                    # 32 cat head P5
   [-1, 2, C3TR, [1024, False]],                  # 33 P5/32-large
   [-1, 1, EMA_attention, [1024]],                # 34 EMA-P5

   [[22, 26, 30, 34], 1, Detect, [nc]]            # 35 Detect(P2, P3, P4, P5)
  ]